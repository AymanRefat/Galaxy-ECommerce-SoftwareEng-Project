<div class="card">
  <div class="card-image-container">
    <div
      class="card-image"
      [style.backgroundImage]="'url(' + primaryImageUrl + ')'">
    </div>
    <div class="category-badge">
      {{ product.category?.name || 'Uncategorized' }}
    </div>
  </div>

  <div class="card-content">
    <h3 class="card-title" [title]="product.name">{{ product.name }}</h3>
    <p class="card-vendor">{{ product.vendor_name }}</p>

    <div class="card-footer">
      <span class="price">${{ formattedPrice }}</span>
      <div *ngIf="product.average_rating > 0" class="rating">
        <span class="star">&#9733;</span> {{ formattedRating }}
      </div>
    </div>

    <button class="add-btn" (click)="addToCart()" [disabled]="addingToCart">
      {{ addingToCart ? 'Adding...' : 'Add to Cart' }}
    </button>
    <p *ngIf="addMessage" class="card-feedback">{{ addMessage }}</p>
  </div>
</div>
